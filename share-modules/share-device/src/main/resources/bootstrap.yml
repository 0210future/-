# Tomcat
server:
  port: 9205

# Spring
spring:
  application:
    # 应用名称
    name: share-device
  profiles:
    # 环境配置
    active: dev
  main:
    allow-bean-definition-overriding: true #当遇到同样名字的时候，是否允许覆盖注册
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 192.168.200.130:8848
        namespace:  00cd2975-083f-4101-907d-b215e54b41e7
      config:
        # 配置中心地址
        server-addr: 192.168.200.130:8848
        namespace:  00cd2975-083f-4101-907d-b215e54b41e7
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}